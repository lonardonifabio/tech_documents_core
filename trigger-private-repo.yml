name: Trigger Private Repository Deployment

on:
  push:
    branches: [main]
    paths:
      - 'documents/**'
      - 'data/**'
  workflow_dispatch:

jobs:
  trigger-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private repository deployment
        run: |
          echo "🚀 Triggering private repository deployment..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PRIVATE_REPO_PAT }}" \
            https://api.github.com/repos/lonardonifabio/tech_documents_core/dispatches \
            -d '{"event_type":"documents-updated","client_payload":{"repository":"${{ github.repository }}","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}}'
          
          echo "✅ Deployment trigger sent successfully!"
          echo "📁 Changed files in documents or data folders detected"
          echo "🔄 Private repository will rebuild and redeploy the site"
