name: Build and Deploy to Public Repo (Lightweight - No Third Party Actions)

on:
  repository_dispatch:
    types: [documents-updated]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-lightweight"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free up disk space
        run: |
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/lonardonifabio/tech_documents_core.git .

      - name: Fetch documents and data (lightweight)
        run: |
          echo "Fetching documents from public repository..."
          git clone --depth=1 https://github.com/lonardonifabio/tech_documents.git temp_public
          
          # Copy only essential folders
          [ -d "temp_public/documents" ] && cp -r temp_public/documents ./documents || mkdir -p documents
          [ -d "temp_public/data" ] && cp -r temp_public/data ./data || (mkdir -p data && echo "[]" > data/documents.json)
          
          # Clean up immediately
          rm -rf temp_public
          echo "✓ Documents and data fetched"

      - name: Setup environment (minimal)
        run: |
          # Use pre-installed Node.js and Python
          node --version
          npm --version
          python3 --version
          
          # Install dependencies (need optional deps for Rollup native binaries)
          npm ci --prefer-offline --no-audit
          echo "✓ Dependencies installed"

      - name: Build site (minimal processing)
        run: |
          # Skip heavy processing for efficiency
          echo "Building site with minimal processing..."
          npm run build
          echo "✓ Site built"

      - name: Deploy efficiently
        run: |
          # Configure git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Clone public repo with minimal history
          git clone --depth=1 https://x-access-token:${{ secrets.PRIVATE_REPO_PAT || secrets.PUBLIC_REPO_PAT }}@github.com/lonardonifabio/tech_documents.git deploy_repo
          cd deploy_repo
          
          # Backup essential folders only
          [ -d "documents" ] && mv documents ../backup_docs
          [ -d "data" ] && mv data ../backup_data
          
          # Remove only web files efficiently
          rm -f *.html *.js *.css *.svg .nojekyll
          rm -rf assets _astro
          
          # Copy new build
          cp -r ../dist/* .
          
          # Restore backups
          [ -d "../backup_docs" ] && mv ../backup_docs ./documents
          [ -d "../backup_data" ] && mv ../backup_data ./data
          
          # Add .nojekyll and deploy
          touch .nojekyll
          git add .
          git commit -m "Deploy: ${{ github.sha }}" || echo "No changes"
          git push origin main
          
          echo "✓ Deployed efficiently"

      - name: Summary
        run: |
          echo "🚀 Lightweight deployment completed!"
          echo "📊 Site: https://lonardonifabio.github.io/tech_documents/"
          echo "💾 Disk space optimized for cost efficiency"
