name: Process Documents with Ollama

on:
  repository_dispatch:
    types: [documents-updated]
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: 'Force reprocess all documents'
        required: false
        default: false
        type: boolean

jobs:
  process-documents:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout private repository (core)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_PAT }}
        fetch-depth: 0

    - name: Smart fetch documents and data from public repository
      run: |
        echo "🔄 Smart fetching documents and data from public repository (source of truth)..."
        git clone --depth=1 https://github.com/lonardonifabio/tech_documents.git temp_public
        
        # Copy documents folder (always safe to overwrite)
        if [ -d "temp_public/documents" ]; then
          cp -r temp_public/documents ./documents
          echo "✓ Documents folder copied ($(find documents -name "*.pdf" | wc -l) PDFs)"
        else
          echo "⚠ Documents folder not found in public repo"
          mkdir -p documents
        fi
        
        # Always use the latest data from public repository (source of truth)
        # This ensures we start with the most recent processed data
        if [ -d "temp_public/data" ]; then
          echo "✅ Using latest data from public repository (source of truth)"
          cp -r temp_public/data ./data
          
          # Validate the copied data
          if [ -f "data/documents.json" ]; then
            if python3 -c "import json; json.load(open('data/documents.json'))" 2>/dev/null; then
              doc_count=$(python3 -c "import json; print(len(json.load(open('data/documents.json'))))")
              echo "✅ documents.json is valid ($doc_count existing documents)"
            else
              echo "❌ documents.json is invalid, creating empty array"
              echo "[]" > data/documents.json
            fi
          fi
          
          if [ -f "data/processed_files.json" ]; then
            if python3 -c "import json; json.load(open('data/processed_files.json'))" 2>/dev/null; then
              processed_count=$(python3 -c "import json; print(len(json.load(open('data/processed_files.json'))))")
              echo "✅ processed_files.json is valid ($processed_count processed files)"
            else
              echo "❌ processed_files.json is invalid, creating empty object"
              echo "{}" > data/processed_files.json
            fi
          fi
          
          echo "✓ Data folder synchronized with public repository"
        else
          echo "⚠ Data folder not found in public repo - creating minimal data"
          mkdir -p data
          echo "[]" > data/documents.json
          echo "{}" > data/processed_files.json
        fi
        
        # Copy previews if they exist to maintain consistency
        if [ -d "temp_public/previews" ]; then
          mkdir -p previews
          cp -r temp_public/previews/* ./previews/ 2>/dev/null || true
          preview_count=$(find previews -name "*.jpg" 2>/dev/null | wc -l || echo '0')
          echo "✓ Copied $preview_count existing preview images"
        fi
        
        # Clean up
        rm -rf temp_public
        
        echo "📊 Processing environment ready:"
        echo "📁 Documents: $(find documents -name "*.pdf" 2>/dev/null | wc -l || echo '0')"
        echo "📄 Existing processed documents: $(python3 -c "import json; print(len(json.load(open('data/documents.json'))))" 2>/dev/null || echo '0')"
        echo "🔍 Processed files tracking: $(python3 -c "import json; print(len(json.load(open('data/processed_files.json'))))" 2>/dev/null || echo '0')"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.ai/install.sh | sh
        
    - name: Start Ollama service
      run: |
        ollama serve &
        sleep 10
        
    - name: Pull AI model
      run: |
        ollama pull gemma3:4b
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Setup public repository for incremental commits
      run: |
        echo "Setting up public repository for incremental commits..."
        
        # Clone public repo for incremental updates
        git clone https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/lonardonifabio/tech_documents.git public_repo
        cd public_repo
        
        # Configure git
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        
        echo "✅ Public repository ready for incremental commits"

    - name: Process documents incrementally with commits
      env:
        OLLAMA_HOST: "127.0.0.1:11434"
        FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
      run: |
        echo "🔄 Starting document processing with incremental commits..."
        python scripts/incremental_ollama_processor.py
        
    - name: Create processing summary
      run: |
        echo "## 📄 Document Processing Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "data/documents.json" ]; then
          TOTAL_DOCS=$(python -c "import json; print(len(json.load(open('data/documents.json'))))")
          echo "✅ **Document processing completed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total documents processed:** $TOTAL_DOCS" >> $GITHUB_STEP_SUMMARY
          echo "- **Processing time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Data pushed to:** https://github.com/lonardonifabio/tech_documents" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Document processing failed**" >> $GITHUB_STEP_SUMMARY
        fi
