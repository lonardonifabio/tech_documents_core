name: Process Documents with Ollama

on:
  repository_dispatch:
    types: [documents-updated]
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: 'Force reprocess all documents'
        required: false
        default: false
        type: boolean

jobs:
  process-documents:
    runs-on: ubuntu-latest
    
    steps:

    - name: Clean up disk space
      run: |
        echo "Spazio prima della pulizia:"
        df -h
        sudo rm -rf /usr/share/dotnet # Rimuove l'SDK di .NET se non necessario
        sudo rm -rf /opt/ghc # Rimuove Haskell se non necessario
        sudo docker image prune -af # Rimuove tutte le immagini Docker non usate
        echo "Spazio dopo la pulizia:"
        df -h
        
    - name: Checkout private repository (core)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_PAT }}
        # fetch-depth: 1 è più veloce e usa meno spazio se non ti serve la cronologia completa
        fetch-depth: 1

    # --- NUOVO STEP: Libera spazio sul runner ---
    # Questa operazione può liberare 10-15 GB
    - name: Free up disk space
      run: |
        echo "🧹 Freeing up disk space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "✅ Disk space freed."
        df -h

    # --- WORKFLOW OTTIMIZZATO: Clona il repo pubblico una sola volta ---
    - name: Clone public repo and prepare workspace
      run: |
        echo "🔄 Cloning public repo for processing and commits..."
        # Clona il repo pubblico in una cartella 'public_repo'
        git clone https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/lonardonifabio/tech_documents.git public_repo
        
        # Copia i documenti e i dati necessari dal repo pubblico alla root del workspace
        # Questo permette allo script Python di trovarli facilmente
        echo "📂 Syncing files..."
        cp -r public_repo/documents ./documents
        cp -r public_repo/data ./data
        mkdir -p previews
        cp -r public_repo/previews/* ./previews/ 2>/dev/null || true
        
        # Configura git all'interno della cartella del repo pubblico
        # Sarà usato più tardi per fare i commit
        cd public_repo
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        cd ..
        
        echo "✅ Workspace is ready."
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.ai/install.sh | sh
        
    - name: Start Ollama service
      run: |
        ollama serve &
        # Attendi che il servizio sia pronto
        sleep 15
        
    - name: Pull AI model
      run: |
        echo "Downloading AI model (this may take a while)..."
        ollama pull gemma:2b # MODIFICATO: Usa un modello più piccolo come gemma:2b (~1.4GB) se possibile.
                            # Se 'gemma3:4b' è necessario, lo spazio liberato prima dovrebbe bastare.
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Assicurati che il file requirements.txt sia nella root o specifica il path corretto
        if [ -f "scripts/requirements.txt" ]; then
          pip install -r scripts/requirements.txt
        else
          echo "requirements.txt not found in scripts folder"
          exit 1
        fi

    # --- STEP DI ELABORAZIONE MODIFICATO ---
    # Non è più necessario clonare di nuovo il repo
    - name: Process documents incrementally with commits
      env:
        OLLAMA_HOST: "127.0.0.1:11434"
        FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
      run: |
        echo "🔄 Starting document processing..."
        # Lo script Python ora deve sapere che il repo per i commit si trova in 'public_repo'
        # Assicurati che lo script salvi i file in './public_repo/data' e './public_repo/previews'
        # e che esegua i comandi git da dentro la cartella './public_repo'
        python scripts/incremental_ollama_processor.py

    - name: Create processing summary
      run: |
        echo "## 📄 Document Processing Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Leggi i dati dalla cartella del repo pubblico dove sono stati salvati
        if [ -f "public_repo/data/documents.json" ]; then
          TOTAL_DOCS=$(python -c "import json; print(len(json.load(open('public_repo/data/documents.json'))))")
          echo "✅ **Document processing completed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total documents processed:** $TOTAL_DOCS" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Document processing failed or no data produced**" >> $GITHUB_STEP_SUMMARY
        fi